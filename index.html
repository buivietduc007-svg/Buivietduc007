<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUÌ VIỆT ĐỨC • REPO</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top left, #183c68 0%, transparent 35%),
        radial-gradient(circle at bottom right, #321b62 0%, transparent 35%),
        linear-gradient(135deg, #02040a, #071525 55%, #0d0618);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 35px 35px;
    }

    .welcome {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(2, 5, 12, 0.72);
      backdrop-filter: blur(12px);
      z-index: 9999;
    }

    .box {
      width: min(650px, 100%);
      padding: 40px 28px;
      border: 1px solid rgba(80, 210, 255, 0.28);
      border-radius: 28px;
      text-align: center;
      background: rgba(7, 15, 30, 0.88);
      box-shadow:
        0 0 50px rgba(0, 190, 255, 0.12),
        0 25px 80px rgba(0,0,0,.55);
      animation: showBox .7s ease;
    }

    @keyframes showBox {
      from {
        opacity: 0;
        transform: translateY(25px) scale(.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .logo {
      width: 85px;
      height: 85px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 24px;
      font-size: 22px;
      font-weight: 900;
      background: linear-gradient(135deg, #19d8ff, #655cff, #b84cff);
      box-shadow: 0 0 35px rgba(38, 205, 255, .28);
    }

    h1 {
      font-size: clamp(25px, 6vw, 42px);
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .hello {
      color: #53dcff;
    }

    .name {
      color: #bd80ff;
    }

    .desc {
      color: #9eb4cf;
      line-height: 1.7;
      font-size: 15px;
    }

    .info {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .tag {
      padding: 10px 15px;
      border-radius: 999px;
      color: #dff8ff;
      border: 1px solid rgba(91, 214, 255, .18);
      background: rgba(255,255,255,.035);
      font-size: 13px;
      font-weight: bold;
    }

    .enter {
      margin-top: 26px;
      width: 100%;
      padding: 14px 20px;
      border: 0;
      border-radius: 15px;
      color: white;
      background: linear-gradient(135deg, #16cdea, #5367ff, #a14fff);
      box-shadow: 0 12px 35px rgba(75, 110, 255, .24);
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      transition: .2s;
    }

    .enter:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .content {
      display: none;
      min-height: 100vh;
      padding: 25px;
      white-space: pre-wrap;
      overflow: auto;
      font-family: Consolas, monospace;
      font-size: 14px;
      line-height: 1.6;
      color: #dcecff;
    }

    .topbar {
      position: fixed;
      top: 15px;
      left: 15px;
      right: 15px;
      z-index: 10;
      padding: 13px 17px;
      border: 1px solid rgba(100, 200, 255, .15);
      border-radius: 15px;
      background: rgba(4, 11, 23, .88);
      backdrop-filter: blur(10px);
      color: #8bdfff;
      font-weight: 800;
    }

    .error {
      color: #ff7185;
      text-align: center;
      margin-top: 80px;
      font-family: Arial, sans-serif;
    }
  </style>
</head>

<body>

  <!-- MENU CHÀO -->
  <div class="welcome" id="welcome">
    <div class="box">

      <div class="logo">BD07</div>

      <h1>
        <span class="hello">XIN CHÀO ĐẾN VỚI</span><br>
        <span class="name">REPO BÙI VIỆT ĐỨC</span>
      </h1>

      <div class="desc">
        Chào mừng bạn đến với repository của
        <b>BUÌVDUC07</b>.
        <br>
        Kho package và tài nguyên được quản lý bởi Buì Việt Đức.
      </div>

      <div class="info">
        <div class="tag">CRE: buivduc07</div>
        <div class="tag">Tele: @buivduc07</div>
        <div class="tag">GitHub Pages</div>
      </div>

      <button class="enter" onclick="enterRepo()">
        🚀 VÀO REPOSITORY
      </button>

    </div>
  </div>

  <!-- NỘI DUNG JSON -->
  <div class="content" id="content">
    <div class="topbar">
      BUÌVDUC07 • REPO BÙI VIỆT ĐỨC
    </div>

    <div id="json">Đang tải JSON...</div>
  </div>

  <script>
    /* =========================
       LOAD JSON
    ========================= */

    fetch('./buivduc07.json', {
      cache: 'no-store'
    })
      .then(response => {
        if (!response.ok) {
          throw new Error('Không thể tải buivduc07.json');
        }
        return response.text();
      })
      .then(data => {
        document.getElementById('json').textContent = data;
      })
      .catch(error => {
        document.getElementById('json').innerHTML =
          '<div class="error">' +
          '❌ ' + error.message +
          '</div>';
      });


    /* =========================
       VÀO REPO
    ========================= */

    function enterRepo() {
      const welcome = document.getElementById('welcome');
      const content = document.getElementById('content');

      welcome.style.opacity = '0';
      welcome.style.transition = 'opacity .35s ease';

      setTimeout(() => {
        welcome.style.display = 'none';
        content.style.display = 'block';
        document.body.style.overflow = 'auto';
      }, 350);
    }


    /* =========================
       CHẶN CHUỘT PHẢI
    ========================= */

    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });


    /* =========================
       CHẶN PHÍM
    ========================= */

    document.addEventListener('keydown', function(e) {

      /* F12 */
      if (e.key === 'F12') {
        e.preventDefault();
        return false;
      }

      /* Ctrl + Shift + I */
      if (
        e.ctrlKey &&
        e.shiftKey &&
        e.key.toLowerCase() === 'i'
      ) {
        e.preventDefault();
        return false;
      }

      /* Ctrl + Shift + J */
      if (
        e.ctrlKey &&
        e.shiftKey &&
        e.key.toLowerCase() === 'j'
      ) {
        e.preventDefault();
        return false;
      }

      /* Ctrl + U */
      if (
        e.ctrlKey &&
        e.key.toLowerCase() === 'u'
      ) {
        e.preventDefault();
        return false;
      }

      /* Ctrl + Shift + C */
      if (
        e.ctrlKey &&
        e.shiftKey &&
        e.key.toLowerCase() === 'c'
      ) {
        e.preventDefault();
        return false;
      }

    });


    /* =========================
       DEVTOOLS DETECTION
    ========================= */

    setInterval(function() {
      const threshold = 160;

      if (
        window.outerWidth - window.innerWidth > threshold ||
        window.outerHeight - window.innerHeight > threshold
      ) {
        document.body.innerHTML = `
          <div style="
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#050812;
            color:white;
            font-family:Arial;
            text-align:center;
            padding:20px;
          ">
            <div>
              <h1 style="color:#56ddff">
                BUÌVDUC07
              </h1>

              <p style="color:#91a8c4">
                DevTools đã được phát hiện.
                <br>
                Vui lòng đóng Developer Tools để tiếp tục.
              </p>
            </div>
          </div>
        `;
      }
    }, 1000);
  </script>

</body>
</html>
