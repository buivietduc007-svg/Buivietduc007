<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050914">
  <title>BUİVDUC07 • REPO BÙI VIỆT ĐỨC</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 15% 0%, rgba(22, 130, 255, .20), transparent 32%),
        radial-gradient(circle at 90% 15%, rgba(157, 76, 255, .18), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(0, 220, 255, .10), transparent 35%),
        linear-gradient(135deg, #02040a 0%, #061120 52%, #0c0617 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(
        to bottom,
        rgba(0,0,0,.95),
        rgba(0,0,0,.30)
      );
    }

    /* =========================
       SPLASH / MENU CHÀO
    ========================= */

    .welcome {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(2, 5, 12, .74);
      backdrop-filter: blur(14px);
      transition:
        opacity .65s ease,
        visibility .65s ease;
    }

    .welcome.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .welcome-box {
      position: relative;
      width: min(680px, 100%);
      padding: 42px 28px 34px;
      text-align: center;
      overflow: hidden;
      border: 1px solid rgba(75, 210, 255, .24);
      border-radius: 30px;
      background:
        linear-gradient(
          145deg,
          rgba(10, 23, 43, .95),
          rgba(6, 12, 27, .94)
        );
      box-shadow:
        0 30px 100px rgba(0,0,0,.55),
        0 0 60px rgba(30, 190, 255, .08);
      animation: boxIn .7s ease;
    }

    .welcome-box::before {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      top: -150px;
      left: -80px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(42, 208, 255, .16),
        transparent 70%
      );
    }

    .welcome-box::after {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      right: -150px;
      bottom: -180px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(166, 81, 255, .14),
        transparent 70%
      );
    }

    @keyframes boxIn {
      from {
        opacity: 0;
        transform: translateY(25px) scale(.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .logo {
      position: relative;
      z-index: 1;
      width: 88px;
      height: 88px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 25px;
      font-size: 22px;
      font-weight: 1000;
      letter-spacing: 1px;
      color: #fff;
      background:
        linear-gradient(
          135deg,
          #1bd8ff 0%,
          #5769ff 52%,
          #b64cff 100%
        );
      box-shadow:
        0 0 42px rgba(37, 205, 255, .25),
        inset 0 1px 0 rgba(255,255,255,.25);
    }

    .welcome-title {
      position: relative;
      z-index: 1;
      font-size: clamp(26px, 6vw, 45px);
      line-height: 1.12;
      font-weight: 950;
      letter-spacing: -1px;
    }

    .cyan {
      color: #55ddff;
    }

    .purple {
      color: #bf82ff;
    }

    .welcome-desc {
      position: relative;
      z-index: 1;
      margin-top: 14px;
      color: #9ab1ca;
      line-height: 1.75;
      font-size: 14px;
    }

    .welcome-info {
      position: relative;
      z-index: 1;
      margin-top: 23px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tag {
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid rgba(105, 205, 255, .17);
      background: rgba(255,255,255,.035);
      color: #dcf6ff;
      font-size: 12px;
      font-weight: 800;
    }

    .loading {
      position: relative;
      z-index: 1;
      width: min(360px, 100%);
      height: 4px;
      margin: 27px auto 0;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255,255,255,.08);
    }

    .loading-bar {
      width: 0%;
      height: 100%;
      border-radius: 99px;
      background:
        linear-gradient(
          90deg,
          #24d8ff,
          #5873ff,
          #b75cff
        );
      animation: loading 2.1s linear forwards;
    }

    @keyframes loading {
      from {
        width: 0%;
      }

      to {
        width: 100%;
      }
    }

    /* =========================
       JSON CONTENT
    ========================= */

    .content {
      display: none;
      min-height: 100vh;
      height: 100vh;
      padding: 86px 18px 24px;
      overflow: auto;
      color: #dceeff;
    }

    .content.show {
      display: block;
      animation: contentIn .45s ease;
    }

    @keyframes contentIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .topbar {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 100;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 12px 17px;
      border: 1px solid rgba(105, 205, 255, .16);
      border-radius: 16px;
      background: rgba(4, 11, 23, .88);
      backdrop-filter: blur(15px);
      box-shadow: 0 10px 35px rgba(0,0,0,.22);
    }

    .brand {
      font-size: 14px;
      font-weight: 950;
      color: #68ddff;
    }

    .brand span {
      color: #ba83ff;
    }

    .support {
      font-size: 12px;
      color: #8fa9c4;
    }

    .json-card {
      width: min(1200px, 100%);
      margin: 0 auto;
      border: 1px solid rgba(105, 205, 255, .13);
      border-radius: 20px;
      overflow: hidden;
      background: rgba(4, 11, 22, .72);
      box-shadow: 0 20px 70px rgba(0,0,0,.30);
    }

    .json-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 13px 16px;
      border-bottom: 1px solid rgba(105, 205, 255, .10);
      color: #8ca8c3;
      font-size: 12px;
      font-weight: 800;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 7px;
      border-radius: 50%;
      background: #42e59a;
      box-shadow: 0 0 12px rgba(66,229,154,.5);
    }

    #json {
      padding: 18px;
      min-height: calc(100vh - 160px);
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;
      font-size: 13px;
      line-height: 1.7;
    }

    .error {
      color: #ff7187;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 20px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 650px) {
      .welcome-box {
        padding: 32px 18px 27px;
        border-radius: 24px;
      }

      .logo {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        font-size: 18px;
      }

      .welcome-desc {
        font-size: 13px;
      }

      .content {
        padding: 80px 10px 15px;
      }

      .topbar {
        top: 9px;
        left: 9px;
        right: 9px;
        min-height: 48px;
        padding: 10px 12px;
      }

      .brand {
        font-size: 12px;
      }

      .support {
        display: none;
      }

      .json-card {
        border-radius: 16px;
      }

      #json {
        padding: 14px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       MENU CHÀO TỰ ĐỘNG
  ========================== -->

  <div class="welcome" id="welcome">
    <div class="welcome-box">

      <div class="logo">
        BD07
      </div>

      <div class="welcome-title">
        <span class="cyan">XIN CHÀO ĐẾN VỚI</span>
        <br>
        <span class="purple">REPO BÙI VIỆT ĐỨC</span>
      </div>

      <div class="welcome-desc">
        Chào mừng bạn đến với repository của
        <b>BUÌVDUC07</b>.
        <br>
        CRE: <b>buivduc07</b>
        •
        Hỗ trợ Tele: <b>@buivduc07</b>
      </div>

      <div class="welcome-info">
        <div class="tag">✦ CRE: buivduc07</div>
        <div class="tag">✈ Tele: @buivduc07</div>
        <div class="tag">◈ JSON REPO</div>
      </div>

      <div class="loading">
        <div class="loading-bar"></div>
      </div>

    </div>
  </div>


  <!-- =========================
       NỘI DUNG JSON
  ========================== -->

  <main class="content" id="content">

    <div class="topbar">
      <div class="brand">
        BUÌVDUC07 <span>• REPO BÙI VIỆT ĐỨC</span>
      </div>

      <div class="support">
        Tele @buivduc07
      </div>
    </div>

    <section class="json-card">

      <div class="json-head">
        <div>
          <span class="dot"></span>
          buivduc07.json
        </div>

        <div>
          GitHub Pages
        </div>
      </div>

      <div id="json">
        Đang tải JSON...
      </div>

    </section>

  </main>


  <script>
    /* =====================================
       TẢI JSON
    ===================================== */

    fetch("./buivduc07.json", {
      cache: "no-store"
    })
      .then(function(response) {

        if (!response.ok) {
          throw new Error(
            "Không thể tải buivduc07.json (HTTP " +
            response.status +
            ")"
          );
        }

        return response.text();
      })

      .then(function(data) {

        document.getElementById("json").textContent = data;

      })

      .catch(function(error) {

        document.getElementById("json").innerHTML =
          '<div class="error">' +
            "❌ " +
            error.message +
          "</div>";

      });


    /* =====================================
       TỰ ĐỘNG ĐÓNG MENU CHÀO
    ===================================== */

    window.addEventListener("load", function() {

      setTimeout(function() {

        var welcome =
          document.getElementById("welcome");

        var content =
          document.getElementById("content");

        welcome.classList.add("hide");

        setTimeout(function() {

          welcome.style.display = "none";

          content.classList.add("show");

          document.body.style.overflow = "auto";

        }, 650);

      }, 2200);

    });


    /* =====================================
       CHẶN CHUỘT PHẢI
    ===================================== */

    document.addEventListener(
      "contextmenu",
      function(event) {
        event.preventDefault();
      }
    );


    /* =====================================
       CHẶN PHÍM TẮT PHỔ BIẾN
    ===================================== */

    document.addEventListener(
      "keydown",
      function(event) {

        /* F12 */

        if (event.key === "F12") {
          event.preventDefault();
          return false;
        }


        /* Ctrl + Shift + I */

        if (
          event.ctrlKey &&
          event.shiftKey &&
          event.key.toLowerCase() === "i"
        ) {
          event.preventDefault();
          return false;
        }


        /* Ctrl + Shift + J */

        if (
          event.ctrlKey &&
          event.shiftKey &&
          event.key.toLowerCase() === "j"
        ) {
          event.preventDefault();
          return false;
        }


        /* Ctrl + Shift + C */

        if (
          event.ctrlKey &&
          event.shiftKey &&
          event.key.toLowerCase() === "c"
        ) {
          event.preventDefault();
          return false;
        }


        /* Ctrl + U */

        if (
          event.ctrlKey &&
          event.key.toLowerCase() === "u"
        ) {
          event.preventDefault();
          return false;
        }


        /* Ctrl + S */

        if (
          event.ctrlKey &&
          event.key.toLowerCase() === "s"
        ) {
          event.preventDefault();
          return false;
        }

      },
      true
    );
  </script>

</body>
</html>
